substitutions:
  name: "hot-tub-knob"
  friendly_name: "Hot Tub Knob"
  # Home Assistant climate entity for the heat pump
  climate_entity: "climate.hot_tub_heat_pump"
  # Dedicated physical water temperature sensor
  water_temp_entity: "sensor.hottub_temp"
  # Heat pump water outlet temp - shown alongside the inlet temp (the
  # climate entity's current_temperature) as secondary readings.
  water_outlet_entity: "sensor.hot_tub_heat_pump_water_outlet_temp"
  # Raw Modbus enum register (0=Auto, 1=Heating, 2=Cooling) - see
  # update_mode_label below.
  heat_pump_operating_mode_entity: "sensor.hot_tub_heat_pump_operating_mode"
  # Mode-aware target setpoint (template number entity in
  # ha-stack's template_hottub.yaml). The heat pump keeps a separate
  # setpoint register per operating mode (Auto/Heating/Cooling), and
  # climate.hot_tub_heat_pump's target_temp_register is hardwired to
  # Auto's register only - this entity picks whichever register matches
  # the current mode, both for reading and writing. Use this instead of
  # climate.set_temperature. See pool-heatpump-integration.md (2026-07-26).
  target_temp_entity: "number.hot_tub_heat_pump_target_temp"
  # How long the display stays lit after last interaction
  screensaver: 30s
  # Setpoint range the knob is allowed to dial, in actual degrees C
  setpoint_min: "26"
  setpoint_max: "40"
  # Same range in half-degree units (x2) - the rotary encoder only counts
  # whole integers, so each detent = 1 unit = 0.5°C
  setpoint_min_units: "52"
  setpoint_max_units: "80"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - light.turn_on:
          id: back_light
          brightness: 50%
      - script.execute: screentime
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

# Custom display driver + rotary encoder component for this exact board.
# (mipi_spi is now built into ESPHome core, no external PR needed anymore.)
external_components:
  - source:
      type: git
      url: https://github.com/KrX3D/WaveShare-Knob-Esp32S3
      ref: main
    refresh: always

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback Hotspot"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# ---------------------------------------------------------------------------
# Display (ST77916 via mipi_spi) + touch (CST816) + backlight
# ---------------------------------------------------------------------------
spi:
  id: display_qspi
  type: quad
  clk_pin: 13
  data_pins: [15, 16, 17, 18]

i2c:
  id: ic_bus
  sda: 11
  scl: 12
  scan: true

display:
  - platform: mipi_spi
    id: main_display
    model: JC3636W518V2
    data_rate: 80MHz
    color_order: rgb
    rotation: 0
    cs_pin: 14
    reset_pin: 21
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never
    dimensions:
      height: 360
      width: 360

touchscreen:
  - platform: cst816
    id: my_touchscreen
    display: main_display
    interrupt_pin: GPIO9
    reset_pin: GPIO10
    transform:
      mirror_x: false
      mirror_y: false
      swap_xy: false
    on_touch:
      then:
        - if:
            condition:
              lambda: 'return id(display_on);'
            then:
              - script.execute: screentime
              - if:
                  # Top-right area (near the power symbol) toggles on/off;
                  # anywhere else cycles the Auto/Heating/Cooling submode.
                  condition:
                    lambda: 'return touch.x > 210 && touch.y < 140;'
                  then:
                    - script.execute: toggle_heatpump
                  else:
                    - script.execute: cycle_operating_mode
            else:
              # Display was off/dimmed - this tap should only wake it,
              # not also act as a mode-toggle/cycle tap.
              - script.execute: screentime

output:
  - platform: ledc
    pin: GPIO47
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    icon: "mdi:television"
    entity_category: config
    id: back_light
    restore_mode: ALWAYS_ON
    default_transition_length: 30ms
    initial_state:
      brightness: 50%
    on_turn_off:
      then:
        - globals.set:
            id: display_on
            value: 'false'
        - lvgl.pause:
            show_snow: true
    on_turn_on:
      then:
        - globals.set:
            id: display_on
            value: 'true'
        - lvgl.resume:

# ---------------------------------------------------------------------------
# Rotary encoder (the physical knob) -> adjusts the setpoint
# ---------------------------------------------------------------------------
globals:
  # Tracks whether the backlight/display is currently on, so the first tap
  # after it's off just wakes it instead of also toggling the heat pump mode.
  - id: display_on
    type: bool
    restore_value: false
    initial_value: 'true'
  # Pending setpoint in half-degree units (actual °C = this / 2.0)
  - id: pending_setpoint_units
    type: int
    restore_value: false
    initial_value: '0'
  - id: setpoint_synced
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: is_mode_on
    type: bool
    restore_value: false
    initial_value: 'false'
  # Target temperature reported by HA, in half-degree units (see above)
  - id: ha_target_units
    type: int
    restore_value: false
    initial_value: '0'
  # True whenever the knob hasn't been physically turned recently - gates
  # the periodic HA resync below so it doesn't fight an active turn.
  - id: knob_quiet
    type: bool
    restore_value: false
    initial_value: 'true'
  # True while sync_knob_from_ha is applying a programmatic value to
  # rotary_counter, since sensor.rotary_encoder_custom.set_value fires
  # rotary_counter's own on_value (it calls publish_state internally) -
  # without this guard, a periodic/boot sync would look just like a
  # physical turn: waking the backlight and echoing an unnecessary
  # climate.set_temperature back to HA.
  - id: syncing_in_progress
    type: bool
    restore_value: false
    initial_value: 'false'

sensor:
  - platform: rotary_encoder_custom
    name: "Knob"
    id: rotary_counter
    pin_a: 8
    pin_b: 7
    # Counts in half-degree units - each detent = 0.5°C
    min_value: ${setpoint_min_units}
    max_value: ${setpoint_max_units}
    restore_mode: RESTORE_DEFAULT_ZERO
    on_value:
      then:
        # Skip all of this for a programmatic sync from HA (see
        # syncing_in_progress) - sync_knob_from_ha already does its own
        # label/marker update, and a sync is not "the user touched it".
        - if:
            condition:
              lambda: 'return !id(syncing_in_progress);'
            then:
              - script.execute: screentime
              - script.execute: mark_knob_active
              - globals.set:
                  id: pending_setpoint_units
                  value: !lambda 'return (int)x;'
              - lvgl.label.update:
                  id: lbl_target
                  text: !lambda 'char b[24]; snprintf(b, sizeof(b), "Target: %.1f°C", x / 2.0f); return std::string(b);'
              - script.execute: update_target_marker
              - script.execute: commit_setpoint

  # Battery voltage (GPIO1 = ADC1_CH0, behind a 2:1 divider on this board)
  - platform: adc
    id: battery_voltage
    pin: GPIO1
    attenuation: 12db
    update_interval: 30s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    internal: true
    filters:
      - multiply: 2.0
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 7
    on_value:
      then:
        - component.update: battery_percentage

  - platform: template
    id: battery_percentage
    unit_of_measurement: "%"
    accuracy_decimals: 0
    internal: true
    lambda: |-
      float v = id(battery_voltage).state;
      if (std::isnan(v) || std::isinf(v)) return 0.0f;
      return v;
    filters:
      - calibrate_linear:
          method: exact
          datapoints:
            - 3.00 -> 0.0
            - 3.30 -> 5.0
            - 3.50 -> 10.0
            - 3.60 -> 20.0
            - 3.65 -> 30.0
            - 3.70 -> 40.0
            - 3.75 -> 50.0
            - 3.80 -> 60.0
            - 3.90 -> 70.0
            - 4.00 -> 80.0
            - 4.10 -> 90.0
            - 4.15 -> 95.0
            - 4.20 -> 100.0
      - lambda: |-
          if (x > 100) return 100.0f;
          if (x < 0) return 0.0f;
          return x;
    on_value:
      then:
        - lambda: |-
            lv_color_t color;
            if (x > 50) color = lv_color_hex(0x00FF00);
            else if (x > 20) color = lv_color_hex(0xFFA500);
            else color = lv_color_hex(0xFF0000);
            lv_obj_set_width(id(batt_fill), (int) (x / 100.0f * 26));
            lv_obj_set_style_bg_color(id(batt_fill), color, 0);

  # Heat pump's own current_temperature attribute (== water inlet temp on
  # this Modbus register map) - secondary reading, shown at the bottom (see
  # water_temp below for the main center reading).
  - platform: homeassistant
    id: current_temp
    entity_id: ${climate_entity}
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_inlet_temp
            text: !lambda 'char b[24]; snprintf(b, sizeof(b), "Inlet: %.1f°C", x); return std::string(b);'

  # Heat pump water outlet temp - secondary reading, shown at the bottom.
  - platform: homeassistant
    id: water_outlet_temp
    entity_id: ${water_outlet_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_outlet_temp
            text: !lambda 'char b[24]; snprintf(b, sizeof(b), "Outlet: %.1f°C", x); return std::string(b);'

  # Heat pump's selected operating submode (Auto/Heating/Cooling) - a raw
  # Modbus enum register with no HA-native concept, exposed as a plain
  # numeric sensor in ha-stack's modbus_hottub.yaml. 0=Auto, 1=Heating,
  # 2=Cooling, confirmed empirically by switching modes in the vendor app.
  # Feeds update_mode_label below, alongside hvac_mode's on/off state.
  - platform: homeassistant
    id: hp_operating_mode
    entity_id: ${heat_pump_operating_mode_entity}
    on_value:
      then:
        - script.execute: update_mode_label

  # Dedicated physical water temperature sensor - the main reading, driving
  # both the big center label and the gauge arc.
  - platform: homeassistant
    id: water_temp
    entity_id: ${water_temp_entity}
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_main_temp
            text: !lambda 'char b[16]; snprintf(b, sizeof(b), "%.1f°C", x); return std::string(b);'
        - lvgl.arc.update:
            id: temp_arc
            value: !lambda 'return (int)x;'

  # Target temperature currently set in HA - used to initialize the knob
  # position on boot / after HA-side changes, without fighting local turns.
  # Reads target_temp_entity (mode-aware number, not climate_entity's
  # `temperature` attribute) since the latter is hardwired to Auto's
  # setpoint register regardless of actual mode - see substitutions above.
  - platform: homeassistant
    id: ha_target_temp
    entity_id: ${target_temp_entity}
    on_value:
      then:
        # Always keep ha_target_units current - the periodic resync
        # interval below applies it to the knob when it's safe to.
        - globals.set:
            id: ha_target_units
            value: !lambda 'return (int) std::round(x * 2.0f);'
        - if:
            condition:
              lambda: 'return !id(setpoint_synced);'
            then:
              - script.execute: sync_knob_from_ha
              - globals.set:
                  id: setpoint_synced
                  value: 'true'

text_sensor:
  # hvac_mode: the entity's actual mode - this device only supports auto/off.
  # The finer-grained Auto/Heating/Cooling submode comes from
  # hp_operating_mode above; both feed update_mode_label.
  - platform: homeassistant
    id: hvac_mode
    entity_id: ${climate_entity}
    on_value:
      then:
        - lambda: 'id(is_mode_on) = (x != "off");'
        - script.execute: update_mode_label

  - platform: wifi_info
    ip_address:
      name: "IP Address"

# Debounce knob turns before actually calling the HA service, so rapid
# rotation doesn't spam climate.set_temperature.
script:
  - id: screentime
    mode: restart
    then:
      - light.turn_on: back_light
      - delay: ${screensaver}
      - light.turn_off: back_light

  # Marks the knob as "active" for 10s after each physical turn, so the
  # periodic HA resync below (see interval:) doesn't fight an in-progress
  # adjustment.
  - id: mark_knob_active
    mode: restart
    then:
      - globals.set:
          id: knob_quiet
          value: 'false'
      - delay: 10s
      - globals.set:
          id: knob_quiet
          value: 'true'

  # Combines hvac_mode's on/off state with hp_operating_mode's
  # Auto/Heating/Cooling submode (0/1/2) to label what the heat pump is set
  # to do. The Modbus climate entity has no hvac_action attribute to read
  # a live "what it's actually doing" status from directly.
  - id: update_mode_label
    then:
      - lambda: |-
          const char *icon;
          lv_color_t color;
          if (!id(is_mode_on)) {
            icon = "";
            color = lv_color_hex(0x888888);
          } else if (!id(hp_operating_mode).has_state()) {
            icon = ""; // thermostat_auto
            color = lv_color_hex(0xCCCCCC);
          } else {
            int mode = (int) id(hp_operating_mode).state;
            if (mode == 1) {
              icon = ""; // sunny (Heating)
              color = lv_color_hex(0xFF6600);
            } else if (mode == 2) {
              icon = ""; // snowflake (Cooling)
              color = lv_color_hex(0x00BFFF);
            } else {
              icon = ""; // thermostat_auto
              color = lv_color_hex(0xCCCCCC);
            }
          }
          lv_obj_set_style_text_color(id(lbl_mode), color, 0);
          lv_label_set_text(id(lbl_mode), icon);
          lv_color_t pwr_color = id(is_mode_on) ? lv_color_hex(0x00FF00) : lv_color_hex(0x888888);
          lv_obj_set_style_text_color(id(pwr_icon), pwr_color, 0);

  # Places target_marker on temp_arc's ring at the angle corresponding to
  # the current target (pending_setpoint_units), using the same
  # start_angle/end_angle/min_value/max_value as temp_arc so the marker
  # lines up with the same physical position the arc's own fill would use.
  - id: update_target_marker
    then:
      - lambda: |-
          float target_c = id(pending_setpoint_units) / 2.0f;
          float frac = (target_c - ${setpoint_min}) / (float) (${setpoint_max} - ${setpoint_min});
          if (frac < 0) frac = 0;
          if (frac > 1) frac = 1;
          float angle_deg = 135.0f + frac * 270.0f;
          if (angle_deg >= 360.0f) angle_deg -= 360.0f;
          float angle_rad = angle_deg * 3.14159265f / 180.0f;
          int dx = (int) std::round(170.0f * std::cos(angle_rad));
          int dy = (int) std::round(170.0f * std::sin(angle_rad));
          lv_obj_align(id(target_marker), LV_ALIGN_CENTER, dx, dy);

  # Called with no trigger-value parameters, so the templated set_value
  # action (which only compiles cleanly outside of a value-carrying trigger)
  # can be invoked safely.
  - id: sync_knob_from_ha
    then:
      - globals.set:
          id: syncing_in_progress
          value: 'true'
      - sensor.rotary_encoder_custom.set_value:
          id: rotary_counter
          value: !lambda 'return id(ha_target_units);'
      - globals.set:
          id: syncing_in_progress
          value: 'false'
      - globals.set:
          id: pending_setpoint_units
          value: !lambda 'return id(ha_target_units);'
      - lvgl.label.update:
          id: lbl_target
          text: !lambda |-
            char b[24];
            snprintf(b, sizeof(b), "Target: %.1f°C", id(ha_target_units) / 2.0f);
            return std::string(b);
      - script.execute: update_target_marker

  - id: commit_setpoint
    mode: restart
    then:
      - delay: 400ms
      # Goes through target_temp_entity (mode-aware number), not
      # climate.set_temperature - the latter always writes Auto's setpoint
      # register regardless of actual mode. See substitutions above.
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: ${target_temp_entity}
            value: !lambda 'return (float)id(pending_setpoint_units) / 2.0f;'

  - id: toggle_heatpump
    then:
      - if:
          condition:
            lambda: 'return id(is_mode_on);'
          then:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${climate_entity}
                  hvac_mode: "off"
          else:
            - homeassistant.action:
                action: climate.set_hvac_mode
                data:
                  entity_id: ${climate_entity}
                  hvac_mode: "auto"

  # Cycles Auto -> Heating -> Cooling -> Auto by writing directly to the
  # operating-mode holding register (no HA-native entity for this - see
  # hp_operating_mode above). Only acts while the heat pump is on; a tap
  # while off does nothing here (use the power dot to turn it on first).
  - id: cycle_operating_mode
    then:
      - if:
          condition:
            lambda: 'return id(is_mode_on);'
          then:
            - homeassistant.action:
                action: modbus.write_register
                data:
                  hub: hottub_heatpump
                  slave: "1"
                  address: "0"
                  value: !lambda |-
                    int current = id(hp_operating_mode).has_state() ? (int) id(hp_operating_mode).state : 0;
                    return (current + 1) % 3;

# Periodic HA resync: applies ha_target_units to the knob's display/position
# whenever the knob has been quiet (no physical turn) for 10s, so changes
# made via HA/the app eventually show up here too, without fighting an
# active turn the way applying on every single HA push would.
interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return id(knob_quiet);'
          then:
            - script.execute: sync_knob_from_ha

# ---------------------------------------------------------------------------
# LVGL UI
# ---------------------------------------------------------------------------
font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_28
    size: 28
  - file: "gfonts://Roboto"
    id: roboto_48
    size: 48
  # Weather-style icons for lbl_mode (Auto/Heating/Cooling), via Google's
  # Material Symbols icon font - codepoints confirmed against Google's own
  # MaterialSymbolsOutlined.codepoints source file.
  - file: "gfonts://Material+Symbols+Outlined"
    id: icons_mode
    size: 36
    glyphs:
      - "" # sunny (Heating)
      - "" # snowflake (Cooling)
      - "" # thermostat_auto (Auto)

lvgl:
  id: my_lvgl
  displays:
    - main_display
  touchscreens:
    - my_touchscreen
  color_depth: 16
  bg_color: 0x001020

  pages:
    - id: main_page
      widgets:
        # On/off power symbol (top-right, LVGL's built-in power glyph,
        # U+F011) - tapping this corner toggles on/off; tapping anywhere
        # else cycles the Auto/Heating/Cooling submode. See
        # touchscreen.on_touch and update_mode_label.
        - label:
            id: pwr_icon
            align: TOP_RIGHT
            x: -75
            y: 82
            text_font: montserrat_28
            text_color: 0x888888
            text: ""

        # Battery icon (same row as the power symbol, further to its left):
        # outline + terminal nub are static, batt_fill's width/color are
        # updated by battery_percentage's on_value above.
        - obj:
            id: batt_body
            align: TOP_RIGHT
            x: -255
            y: 96
            width: 30
            height: 14
            radius: 2
            bg_opa: TRANSP
            border_width: 2
            border_color: 0xAAAAAA
        - obj:
            id: batt_nub
            align: TOP_RIGHT
            x: -252
            y: 100
            width: 3
            height: 6
            radius: 0
            border_width: 0
            bg_color: 0xAAAAAA
        - obj:
            id: batt_fill
            align: TOP_LEFT
            x: 77
            y: 98
            width: 0
            height: 10
            radius: 0
            border_width: 0
            bg_color: 0x888888

        # Outer gauge: current water temperature. Range matches the knob's
        # actual setpoint_min/max (not some wider arbitrary scale) so the
        # fill visibly moves; the track itself is a thin/dark "hollow"
        # guide line, with only the filled indicator bold and colored.
        - arc:
            id: temp_arc
            align: CENTER
            width: 340
            height: 340
            arc_width: 3
            start_angle: 135
            end_angle: 45
            min_value: ${setpoint_min}
            max_value: ${setpoint_max}
            value: ${setpoint_min}
            adjustable: false
            arc_color: 0x333333
            indicator:
              arc_width: 14
              arc_color: 0xFF6600

        # Target setpoint marker - a dot placed on temp_arc's ring at the
        # angle corresponding to the current target, kept in sync by
        # update_target_marker (called whenever the target changes).
        - obj:
            id: target_marker
            align: CENTER
            width: 10
            height: 10
            radius: 5
            border_width: 0
            bg_color: 0xFFFFFF

        # Big reading: dedicated water temperature sensor (the main reading)
        - label:
            id: lbl_main_temp
            align: CENTER
            y: -30
            text_font: roboto_48
            text_color: 0xFFFFFF
            text: "--.-°C"

        # Target / setpoint (driven by the knob)
        - label:
            id: lbl_target
            align: CENTER
            y: 30
            text_font: roboto_28
            text_color: 0x00BFFF
            text: "Target: --°C"

        # Heat pump mode (auto / heating / cooling / off) as an icon - what
        # the touch toggle/cycle controls. See update_mode_label.
        - label:
            id: lbl_mode
            align: CENTER
            y: 65
            text_font: icons_mode
            text_color: 0x888888
            text: ""

        # Secondary readings: heat pump's own water inlet/outlet temps
        - label:
            id: lbl_inlet_temp
            align: CENTER
            y: 110
            text_font: roboto
            text_color: 0x00BFFF
            text: "Inlet: --.-°C"

        - label:
            id: lbl_outlet_temp
            align: CENTER
            y: 134
            text_font: roboto
            text_color: 0x00BFFF
            text: "Outlet: --.-°C"
