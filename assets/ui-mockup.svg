<svg width="440" height="440" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bezel" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#8a8f96"/>
      <stop offset="55%" stop-color="#55585d"/>
      <stop offset="100%" stop-color="#232427"/>
    </radialGradient>
    <clipPath id="screenClip">
      <circle cx="220" cy="220" r="180"/>
    </clipPath>
  </defs>

  <!-- CNC metal case bezel -->
  <circle cx="220" cy="220" r="210" fill="url(#bezel)"/>
  <circle cx="220" cy="220" r="210" fill="none" stroke="#111" stroke-width="2"/>

  <!-- Screen -->
  <g clip-path="url(#screenClip)">
    <rect x="40" y="40" width="360" height="360" fill="#001020"/>

    <!-- Outer gauge arc: track (current temp scale, 10-45°C, 90° gap at top) -->
    <path d="M 99.8 340.2 A 170 170 0 1 1 340.2 340.2"
          fill="none" stroke="#00BFFF" stroke-width="14" stroke-linecap="round"/>
    <!-- indicator portion showing current value (35°C) progress along the scale -->
    <path d="M 99.8 340.2 A 170 170 0 1 1 363.9 129.6"
          fill="none" stroke="#FF6600" stroke-width="14" stroke-linecap="round"/>

    <!-- Big current temperature -->
    <text x="220" y="200" text-anchor="middle" font-size="46" font-weight="600" fill="#FFFFFF">35.0°C</text>

    <!-- Target / setpoint -->
    <text x="220" y="260" text-anchor="middle" font-size="26" fill="#00BFFF">Target: 33.5°C</text>

    <!-- HVAC action -->
    <text x="220" y="305" text-anchor="middle" font-size="20" fill="#FF6600">Heating</text>

    <!-- Mode -->
    <text x="220" y="335" text-anchor="middle" font-size="20" fill="#00FF00">Mode: Auto</text>

    <!-- Dedicated water temp sensor -->
    <text x="220" y="365" text-anchor="middle" font-size="20" fill="#00BFFF">Water: 34.2°C</text>
  </g>

  <!-- Bezel highlight ring -->
  <circle cx="220" cy="220" r="190" fill="none" stroke="#9a9ea3" stroke-width="1.5" opacity="0.5"/>

  <!-- Physical knob indicator (top notch, decorative) -->
  <circle cx="220" cy="18" r="6" fill="#cfd2d6"/>
</svg>
