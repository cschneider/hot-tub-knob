<svg width="440" height="440" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bezel" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#8a8f96"/>
      <stop offset="55%" stop-color="#55585d"/>
      <stop offset="100%" stop-color="#232427"/>
    </radialGradient>
    <clipPath id="screenClip">
      <circle cx="220" cy="220" r="180"/>
    </clipPath>
  </defs>

  <!-- CNC metal case bezel -->
  <circle cx="220" cy="220" r="210" fill="url(#bezel)"/>
  <circle cx="220" cy="220" r="210" fill="none" stroke="#111" stroke-width="2"/>

  <!-- Screen -->
  <g clip-path="url(#screenClip)">
    <rect x="40" y="40" width="360" height="360" fill="#001020"/>

    <!-- Outer gauge arc: thin/dark "hollow" track (26-40°C scale, 90° gap at bottom) -->
    <path d="M 99.8 340.2 A 170 170 0 1 1 340.2 340.2"
          fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round"/>
    <!-- indicator: bold fill up to current value (38.0°C) -->
    <path d="M 99.8 340.2 A 170 170 0 1 1 388.9 239.0"
          fill="none" stroke="#FF6600" stroke-width="14" stroke-linecap="round"/>
    <!-- target setpoint marker (36.0°C) -->
    <circle cx="363.9" cy="129.4" r="5" fill="#FFFFFF"/>

    <!-- Big current temperature (dedicated water temp sensor) -->
    <text x="220" y="200" text-anchor="middle" font-size="46" font-weight="600" fill="#FFFFFF">38.0°C</text>

    <!-- Target / setpoint -->
    <text x="220" y="260" text-anchor="middle" font-size="26" fill="#00BFFF">Target: 36.0°C</text>

    <!-- Mode icon: sun = Heating (orange). 1.5x scale to match the
         firmware's icons_mode font bump from 24px to 36px. -->
    <g transform="translate(220,285) scale(1.5)" stroke="#FF6600" stroke-width="2" stroke-linecap="round">
      <circle r="6" fill="#FF6600" stroke="none"/>
      <line x1="0" y1="-8" x2="0" y2="-12"/>
      <line x1="0" y1="8" x2="0" y2="12"/>
      <line x1="-8" y1="0" x2="-12" y2="0"/>
      <line x1="8" y1="0" x2="12" y2="0"/>
      <line x1="-5.7" y1="-5.7" x2="-8.5" y2="-8.5"/>
      <line x1="5.7" y1="-5.7" x2="8.5" y2="-8.5"/>
      <line x1="-5.7" y1="5.7" x2="-8.5" y2="8.5"/>
      <line x1="5.7" y1="5.7" x2="8.5" y2="8.5"/>
    </g>

    <!-- Heat pump water inlet/outlet temps - moved down 15px to clear the larger mode icon -->
    <text x="220" y="330" text-anchor="middle" font-size="20" fill="#00BFFF">Inlet: 37.5°C</text>
    <text x="220" y="354" text-anchor="middle" font-size="20" fill="#00BFFF">Outlet: 38.5°C</text>

    <!-- Battery icon (top-right, ~70% charged) -->
    <rect x="115" y="136" width="30" height="14" rx="2" fill="none" stroke="#AAAAAA" stroke-width="2"/>
    <rect x="145" y="140" width="3" height="6" fill="#AAAAAA"/>
    <rect x="117" y="138" width="18" height="10" fill="#00FF00"/>

    <!-- Power symbol (top-right, green = on) -->
    <path d="M 317.3 127.0 A 11 11 0 1 1 304.7 127.0" fill="none" stroke="#00FF00" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="311" y1="133" x2="311" y2="119" stroke="#00FF00" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Bezel highlight ring -->
  <circle cx="220" cy="220" r="190" fill="none" stroke="#9a9ea3" stroke-width="1.5" opacity="0.5"/>

  <!-- Physical knob indicator (top notch, decorative) -->
  <circle cx="220" cy="18" r="6" fill="#cfd2d6"/>
</svg>
